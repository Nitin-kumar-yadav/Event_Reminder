name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to project directory
            cd /home/${{ secrets.EC2_USER }}/Event_Reminder # Adjust path as needed

            # Pull latest changes
            git pull origin main

            # Backend Setup
            cd backend
            npm install
            # Restart backend (assuming PM2 is used)
            pm2 restart index || pm2 start index.js --name "backend"

            # Frontend Setup
            cd ../frontend
            npm install
            npm run build
            # If serving frontend with PM2/serve or just Nginx pointing to dist
            # Example for PM2 serving build folder (if applicable)
            # pm2 restart frontend || pm2 serve dist 5173 --name "frontend"
            # Or if using Nginx, just the build is enough if Nginx points to this dir
